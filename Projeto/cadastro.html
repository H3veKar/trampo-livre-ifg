<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Trampo Livre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <style>
    /* Cores principais */
    :root {
      --blue-dark: #1a5492;
      --blue-light: #3399ff;
      --white: #ffffff;
      --black: #000000;
    }

    body {
      background-color: var(--blue-dark);
      color: var(--white);
      font-family: 'Arial', sans-serif;
    }

    .navbar {
      background-color: var(--blue-dark);
      border-bottom: 2px solid var(--blue-light);
    }

    .navbar-brand {
      color: var(--white) !important;
      font-weight: bold;
    }

    .navbar-nav .nav-link {
      color: var(--white) !important;
    }

    .navbar-nav .nav-link:hover {
      color: var(--blue-light) !important;
    }

    .container {
      padding-top: 50px;
    }

    .h1 {
      color: var(--blue-light);
      font-weight: bold;
      text-align: center;
    }

    .form-control {
      background-color: var(--blue-dark);
      color: var(--white);
      border: 1px solid var(--blue-light);
    }

    .form-control::placeholder {
      color: var(--blue-light);
    }

    .form-control:focus {
      border-color: var(--blue-light);
      box-shadow: 0 0 5px var(--blue-light);
    }

    .btn-primary {
      background-color: var(--blue-light);
      border: none;
      color: var(--black);
    }

    .btn-primary:hover {
      background-color: var(--blue-dark);
      color: var(--white);
    }

    .btn {
      transition: background-color 0.3s ease;
    }

    .container form {
      background-color: var(--blue-dark);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .container form .mb-3 {
      margin-bottom: 1.5rem;
    }

  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="Index.html">Trampo Livre</a>
  </div>
</nav>

<div class="container mt-5">
  <h1 class="text-center mb-4">Cadastro de Usuário</h1>

  <!-- Formulário de Cadastro -->
  <form id="cadastroForm" action="/api/cadastro" method="POST" class="mx-auto" style="max-width: 400px;">
    <div class="mb-3">
      <input type="text" class="form-control" name="nome" placeholder="Nome" required>
    </div>
    <div class="mb-3">
      <input type="email" class="form-control" name="email" placeholder="Email" required>
    </div>
    <div class="mb-3">
      <input type="password" class="form-control" name="senha" placeholder="Senha" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Tipo de Usuário:</label>
      <select class="form-select" name="tipo" required>
        <option value="anunciador">Anunciador</option>
        <option value="procurador">Procurador de Vagas</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
  </form>

  <!-- Mensagem de sucesso -->
  <div id="successMessage" class="alert alert-success mt-4" style="display:none;">
    Cadastro realizado com sucesso! Você será redirecionado para a página de login.
  </div>
</div>

<script>
  // Simulação de sucesso no cadastro e redirecionamento
  const form = document.getElementById('cadastroForm');
  form.addEventListener('submit', function(event) {
    event.preventDefault(); // Impede o envio do formulário por padrão

    // Simulação de envio e resposta de sucesso
    setTimeout(function() {
      // Exibe a mensagem de sucesso
      document.getElementById('successMessage').style.display = 'block';

      // Redireciona após 3 segundos
      setTimeout(function() {
        window.location.href = "login.html";
        // Redireciona para a página de login
      }, 3000);
    }, 1000);
  });
</script>

</body>
</html>
