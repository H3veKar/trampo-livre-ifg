<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

  <style>
    /* Cores principais */
    :root {
      --blue-dark: #1a5492;
      --blue-light: #3399ff;
      --white: #ffffff;
      --black: #000000;
    }

    body {
      background-color: var(--blue-dark);
      color: var(--white);
      font-family: 'Arial', sans-serif;
    }

    .navbar {
      background-color: var(--blue-dark);
      border-bottom: 2px solid var(--blue-light);
    }

    .navbar-brand {
      color: var(--white) !important;
      font-weight: bold;
    }

    .navbar-nav .nav-link {
      color: var(--white) !important;
    }

    .navbar-nav .nav-link:hover {
      color: var(--blue-light) !important;
    }

    .container {
      padding-top: 50px;
    }

    .h1 {
      color: var(--blue-light);
      font-weight: bold;
      text-align: center;
    }

    .form-control {
      background-color: var(--blue-dark);
      color: var(--white);
      border: 1px solid var(--blue-light);
    }

    .form-control::placeholder {
      color: var(--blue-light);
    }

    .form-control:focus {
      border-color: var(--blue-light);
      box-shadow: 0 0 5px var(--blue-light);
    }

    .btn-primary {
      background-color: var(--blue-light);
      border: none;
      color: var(--black);
    }

    .btn-primary:hover {
      background-color: var(--blue-dark);
      color: var(--white);
    }

    .btn {
      transition: background-color 0.3s ease;
    }

    .container form {
      background-color: var(--blue-dark);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .container form .mb-3 {
      margin-bottom: 1.5rem;
    }
  </style>

</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary navbar bg-dark border-bottom border-body" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="Index.html">Trampo Livre</a>
  </div>
</nav>

<div class="container mt-5">
  <h1 class="text-center mb-4">Login</h1>
  <form id="loginForm" action="/api/login" method="POST" class="mx-auto" style="max-width: 400px;">
    <div class="mb-3">
      <input type="email" class="form-control" name="email" placeholder="Email" required>
    </div>
    <div class="mb-3">
      <input type="password" class="form-control" name="senha" placeholder="Senha" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Entrar</button>
  </form>
  <p class="text-center mt-3">Ainda não tem uma conta? <a href="cadastro.html" class="text-white">Cadastre-se aqui</a></p>
</div>
</body>
